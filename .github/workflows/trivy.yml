name: Trivy Scan

on:
  pull_request:

env:
  IMAGE_NAME: stellarvote

jobs:
  docker_build_trivy_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
